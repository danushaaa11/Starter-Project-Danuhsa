<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie Collection Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="container">
    <header>
      <p class="tag">CBMM 2013 — Assignment 1</p>
      <h1>Movie<br><span>Collection</span></h1>
      <p class="subtitle">Add, browse, and search your personal movie library.</p>
    </header>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('add')">＋ Add Movie</button>
      <button class="tab" onclick="switchTab('view')">☰ View All</button>
      <button class="tab" onclick="switchTab('search')">⌕ Search</button>
    </div>

    <!-- ADD -->
    <div class="panel active" id="panel-add">
      <div class="form-group">
        <label>Movie Title</label>
        <input type="text" id="title" placeholder="e.g. Interstellar"/>
      </div>
      <div class="form-group">
        <label>Genre</label>
        <input type="text" id="genre" placeholder="e.g. Sci-Fi"/>
      </div>
      <div class="form-group">
        <label>Rating (0–10)</label>
        <input type="number" id="rating" min="0" max="10" step="0.1" placeholder="e.g. 8.5"/>
      </div>
      <button class="btn btn-primary" onclick="addMovie()">Add to Collection</button>
    </div>

    <!-- VIEW -->
    <div class="panel" id="panel-view">
      <div class="movie-list" id="movie-list">
        <div class="empty">
          <div class="empty-icon">🎬</div>
          No movies yet. Add one first!
        </div>
      </div>
    </div>

    <!-- SEARCH -->
    <div class="panel" id="panel-search">
      <div class="form-group">
        <label>Search by Title</label>
        <input type="text" id="search-input" placeholder="e.g. Dune"/>
      </div>
      <button class="btn btn-search" onclick="searchMovie()">Search</button>
      <div class="result-box" id="result-box">
        <p class="result-label" id="result-label"></p>
        <div id="result-content"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const movies = [];

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', ['add','view','search'][i] === tab);
      });
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + tab).classList.add('active');
      if (tab === 'view') renderMovies();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function addMovie() {
      const title = document.getElementById('title').value.trim();
      const genre = document.getElementById('genre').value.trim();
      const rating = parseFloat(document.getElementById('rating').value);

      if (!title || !genre || isNaN(rating) || rating < 0 || rating > 10) {
        showToast('Please fill in all fields correctly!');
        return;
      }

      movies.push({ title, genre, rating });
      document.getElementById('title').value = '';
      document.getElementById('genre').value = '';
      document.getElementById('rating').value = '';
      showToast(`"${title}" added!`);
    }

    function renderMovies() {
      const list = document.getElementById('movie-list');
      if (movies.length === 0) {
        list.innerHTML = `<div class="empty"><div class="empty-icon">🎬</div>No movies yet. Add one first!</div>`;
        return;
      }
      list.innerHTML = movies.map((m, i) => `
        <div class="movie-card" style="animation-delay:${i * 0.05}s">
          <div class="movie-num">0${i + 1}</div>
          <div class="movie-info">
            <div class="movie-title">${m.title}</div>
            <div class="movie-meta"><span>🎭 ${m.genre}</span></div>
          </div>
          <div class="rating-badge">★ ${m.rating}</div>
        </div>
      `).join('');
    }

    function searchMovie() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const box = document.getElementById('result-box');
      const label = document.getElementById('result-label');
      const content = document.getElementById('result-content');

      if (!query) { showToast('Enter a title to search!'); return; }

      const found = movies.find(m => m.title.toLowerCase() === query);
      box.className = 'result-box show ' + (found ? 'found' : 'not-found');

      if (found) {
        label.textContent = '✓ Found';
        content.innerHTML = `
          <div class="movie-title" style="font-size:17px;margin-bottom:6px">${found.title}</div>
          <div class="movie-meta" style="display:flex;gap:12px;font-size:13px;color:var(--muted)">
            <span>🎭 ${found.genre}</span>
            <span>★ ${found.rating}/10</span>
          </div>`;
      } else {
        label.textContent = '✗ Not Found';
        content.innerHTML = `<p style="color:var(--muted);font-size:13px">No movie titled "<strong style="color:var(--text)">${query}</strong>" in your collection.</p>`;
      }
    }
  </script>
</body>
</html>
